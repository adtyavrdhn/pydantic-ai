name: ci-exp-cov2
# Leave-out coverage on data RECORDED by the candidate coverage version: real artifacts of a full ci.yml run on the
# fork, on the exact commit that produced them. Runs no tests.
on:
  push:
    branches: [ci-exp-cov2*]
env:
  UV_FROZEN: "1"
  UV_PYTHON_PREFERENCE: only-managed
permissions:
  contents: read
  actions: read
jobs:
  leaveout:
    name: ${{ matrix.run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [41862154630]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ci-cand-1
          path: repo
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: data
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
      - name: leave-out reports
        shell: bash
        env:
          RUN: ${{ matrix.run }}
        run: |
          ls -a data | sed 's/\.[A-Za-z0-9_]*\.[0-9]*\.[A-Za-z0-9]*$//' | sort | uniq -c
          cd repo
          echo "EXPTREE $(git rev-parse HEAD)"
          uv sync --group dev --group coverage
          uv run --no-sync coverage --version | head -1
          mkdir -p "$GITHUB_WORKSPACE/out"
          variant() {
            local name="$1" drop="$2"
            rm -rf .coverage; mkdir .coverage
            local kept=0
            for f in "$GITHUB_WORKSPACE/data"/.coverage*; do
              b=$(basename "$f")
              if [[ -n "$drop" && "$b" =~ $drop ]]; then continue; fi
              cp "$f" .coverage/; kept=$((kept+1))
            done
            local t0=$SECONDS
            uv run --no-sync coverage combine -q > /dev/null
            local rc=0
            uv run --no-sync coverage report --skip-covered --show-missing > "$GITHUB_WORKSPACE/out/$RUN-$name.txt" 2>&1 || rc=$?
            echo "EXPCOV run=$RUN variant=$name kept=$kept rc=$rc seconds=$((SECONDS-t0)) $(tail -1 "$GITHUB_WORKSPACE/out/$RUN-$name.txt" | tr -s ' ')"
            local sn=0
            COVERAGE_FILE=.coverage/.coverage uv run --no-sync strict-no-cover > "$GITHUB_WORKSPACE/out/$RUN-$name-strict.txt" 2>&1 || sn=$?
            echo "EXPCOV run=$RUN variant=$name strict_rc=$sn"
          }
          variant baseline ''
          variant drop311all '^\.coverage\.3\.11-'
          variant drop311allextras '^\.coverage\.3\.11-all-extras'
          variant drop311durable '^\.coverage\.3\.11-durable'
          variant drop312durable '^\.coverage\.3\.12-durable'
          variant drop314lowest '^\.coverage\.3\.14-lowest'
          variant baselineagain ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaveout-${{ matrix.run }}
          path: out
